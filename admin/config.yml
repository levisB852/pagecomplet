backend:
  name: git-gateway
  branch: main

local_backend: true
locale: "es"
show_preview_links: false

editor:
  preview: false

media_folder: "img/galeria/uploads"
public_folder: "img/galeria/uploads"

site_url: "https://iadsder.org"
display_url: "https://iadsder.org"
logo_url: "/img/Logo_IADSDER.png"

collections:
  - name: "contenido"
    label: "Contenido del sitio"
    files:
      - name: "videos"
        label: "Videos de YouTube"
        file: "data/videos.json"
        format: "json"
        fields:
          - label: "Lista de videos"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Publicado"
                name: "published"
                widget: "boolean"
                default: true
                hint: "Apagalo si quieres guardar el video sin mostrarlo en la pagina."
              - label: "ID de YouTube"
                name: "id"
                widget: "string"
                hint: "Ejemplo: si el enlace es https://www.youtube.com/watch?v=OgonAQOnNSo, escribe solo OgonAQOnNSo."
              - label: "Titulo"
                name: "title"
                widget: "string"
              - label: "Descripcion corta"
                name: "description"
                widget: "text"
                required: false
                hint: "Texto breve que aparece debajo del video."

      - name: "eventos"
        label: "Eventos"
        file: "data/eventos.json"
        format: "json"
        fields:
          - label: "Lista de eventos"
            name: "eventos"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - label: "Publicado"
                name: "published"
                widget: "boolean"
                default: true
                hint: "Apagalo si quieres preparar el evento sin mostrarlo todavia."
              - label: "Titulo"
                name: "title"
                widget: "string"
              - label: "Tipo"
                name: "type"
                widget: "select"
                options:
                  - { label: "Culto", value: "culto" }
                  - { label: "Jovenes", value: "jovenes" }
                  - { label: "Comunidad", value: "comunidad" }
                  - { label: "Especial", value: "especial" }
                  - { label: "Ninos", value: "ninos" }
              - label: "Fecha"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: "Hora"
                name: "time"
                widget: "string"
                required: false
                hint: "Ejemplo: 7:00 PM"
              - label: "Lugar"
                name: "place"
                widget: "string"
                required: false
              - label: "Enlace de ubicacion"
                name: "locationUrl"
                widget: "string"
                required: false
                hint: "Pega aqui el enlace de Google Maps. Si lo dejas vacio, el lugar se mostrara como texto normal."
              - label: "Imagen del evento"
                name: "cover"
                widget: "image"
                required: false
                hint: "Opcional. Si no subes imagen, se usa una imagen predeterminada."

      - name: "galeria"
        label: "Galeria de imagenes"
        file: "data/galeria.json"
        format: "json"
        fields:
          - label: "Lista de imagenes"
            name: "imagenes"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Publicado"
                name: "published"
                widget: "boolean"
                default: true
                hint: "Apagalo para guardar la foto sin mostrarla todavia."
              - label: "Imagen"
                name: "image"
                widget: "image"
              - label: "Texto alternativo"
                name: "alt"
                widget: "string"
                required: false
                hint: "Describe la foto en pocas palabras."

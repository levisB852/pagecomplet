backend:
  name: git-gateway
  branch: main

local_backend: true
locale: "es"
show_preview_links: false
editor:
  preview: true

media_folder: "img/galeria/uploads"
public_folder: "/img/galeria/uploads"
site_url: "https://iadsder.org"
display_url: "https://iadsder.org"
logo_url: "/img/Logo_IADSDER-1000.webp"

collections:
  - name: "galeria_admin"
    label: "Galeria juvenil"
    description: "Sube y organiza las fotografias que aparecen en Eventos Juveniles."
    files:
      - name: "galeria"
        label: "Administrar fotografias"
        file: "data/galeria.json"
        format: "json"
        fields:
          - label: "Fotografias publicadas"
            name: "imagenes"
            widget: "list"
            label_singular: "Agregar fotografias"
            hint: "Para cargar varias de una vez usa el botón verde Subir varias fotos. Aquí también puedes ordenar o borrar fotos."
            allow_add: true
            collapsed: true
            add_to_top: true
            field:
              label: "Seleccionar una imagen"
              name: "image"
              widget: "image"
              choose_url: false

  - name: "videos_admin"
    label: "Videos"
    description: "Administra los videos mostrados en la pagina principal."
    files:
      - name: "videos"
        label: "Videos de YouTube"
        file: "data/videos.json"
        format: "json"
        fields:
          - label: "Lista de videos"
            name: "videos"
            widget: "list"
            label_singular: "Agregar video"
            summary: "{{fields.title}}"
            collapsed: true
            add_to_top: true
            fields:
              - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
              - { label: "ID de YouTube", name: "id", widget: "string", hint: "Ejemplo: en youtube.com/watch?v=OgonAQOnNSo, el ID es OgonAQOnNSo." }
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "Descripcion corta", name: "description", widget: "text", required: false }

  - name: "transmision_admin"
    label: "Transmision en vivo"
    description: "Muestra u oculta un Live de YouTube o Facebook en la pagina principal."
    files:
      - name: "transmision"
        label: "Configurar transmision"
        file: "data/en-vivo.json"
        format: "json"
        fields:
          - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: false, hint: "Activalo solamente mientras haya una transmision disponible." }
          - { label: "Enlace de YouTube Live", name: "youtubeUrl", widget: "string", required: false, hint: "Pega el enlace completo del video en vivo de YouTube." }
          - { label: "Enlace de Facebook Live", name: "facebookUrl", widget: "string", required: false, hint: "Pega el enlace completo y publico del video en vivo de Facebook." }
          - { label: "Titulo", name: "title", widget: "string", default: "Transmision en vivo" }
          - { label: "Descripcion", name: "description", widget: "text", required: false }

  - name: "filiales_admin"
    label: "Filiales"
    description: "Agrega o edita varias iglesias, guárdalas como borrador y publícalas cuando todo esté listo."
    files:
      - name: "filiales"
        label: "Administrar filiales"
        file: "data/filiales.json"
        format: "json"
        fields:
          - label: "Lista de filiales"
            name: "filiales"
            widget: "list"
            label_singular: "Agregar filial"
            summary: "{{fields.name}} — {{fields.zone}} — Circuito {{fields.circuit}}"
            collapsed: true
            add_to_top: true
            hint: "Puedes agregar varias filiales en esta misma pantalla antes de guardar."
            fields:
              - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Direccion", name: "address", widget: "string", required: false }
              - label: "Departamento"
                name: "zone"
                widget: "select"
                required: true
                options:
                  - { label: "Ahuachapán", value: "ahuachapan" }
                  - { label: "Santa Ana", value: "santa ana" }
                  - { label: "Sonsonate", value: "sonsonate" }
                  - { label: "Chalatenango", value: "chalatenango" }
                  - { label: "La Libertad", value: "la libertad" }
                  - { label: "San Salvador", value: "san salvador" }
                  - { label: "Cuscatlán", value: "cuscatlan" }
                  - { label: "La Paz", value: "la paz" }
                  - { label: "Cabañas", value: "cabanas" }
                  - { label: "San Vicente", value: "san vicente" }
                  - { label: "Usulután", value: "usulutan" }
                  - { label: "San Miguel", value: "san miguel" }
                  - { label: "Morazán", value: "morazan" }
                  - { label: "La Unión", value: "la union" }
              - label: "Circuito"
                name: "circuit"
                widget: "select"
                required: false
                default: ""
                hint: "Abre cada filial y selecciona aquí el circuito al que pertenece. También aparecerá en el título de la ficha."
                options:
                  - { label: "Sin asignar", value: "" }
                  - { label: "Circuito 1", value: "1" }
                  - { label: "Circuito 2", value: "2" }
                  - { label: "Circuito 3", value: "3" }
                  - { label: "Circuito 4", value: "4" }
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Enlace de Google Maps", name: "mapsUrl", widget: "string", required: false }
              - { label: "Mapa incrustado", name: "embedUrl", widget: "text", required: false, hint: "Opcional. Puedes pegar el enlace de inserción o el código iframe completo de Google Maps." }
              - { label: "Encargado o contacto", name: "contact", widget: "string", required: false }
              - { label: "Horario", name: "schedule", widget: "string", required: false }

  - name: "pagina_admin"
    label: "Pagina principal"
    description: "Versiculo semanal y datos usados al compartir el sitio."
    files:
      - name: "versiculo"
        label: "Versiculo de la semana"
        file: "data/versiculo.json"
        format: "json"
        fields:
          - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
          - { label: "Cita biblica", name: "reference", widget: "string" }
          - { label: "Texto del versiculo", name: "text", widget: "text" }
          - { label: "Nota corta", name: "note", widget: "string", required: false }
      - name: "ajustes"
        label: "SEO y compartir"
        file: "data/ajustes.json"
        format: "json"
        fields:
          - label: "Datos del sitio"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "Descripcion", name: "description", widget: "text" }
              - { label: "Imagen para compartir", name: "image", widget: "image", required: false }

backend:
  name: git-gateway
  branch: main

local_backend: true
locale: "es"
show_preview_links: false
editor:
  preview: true

media_folder: "img/galeria/uploads"
public_folder: "/img/galeria/uploads"
site_url: "https://iadsder.org"
display_url: "https://iadsder.org"
logo_url: "/img/Logo_IADSDER.png"

collections:
  - name: "galeria_admin"
    label: "Galeria juvenil"
    description: "Sube y organiza las fotografias que aparecen en Eventos Juveniles."
    files:
      - name: "galeria"
        label: "Administrar fotografias"
        file: "data/galeria.json"
        format: "json"
        fields:
          - label: "Fotografias publicadas"
            name: "imagenes"
            widget: "list"
            label_singular: "Agregar fotografia"
            summary: "{{fields.alt}}"
            hint: "Presiona Agregar fotografia; luego usa Seleccionar imagen para elegir una foto del telefono."
            allow_add: true
            collapsed: true
            add_to_top: true
            fields:
              - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
              - label: "Seleccionar imagen"
                name: "image"
                widget: "image"
                choose_url: false
                media_library:
                  config:
                    multiple: false
              - { label: "Descripcion", name: "alt", widget: "string", hint: "Describe brevemente lo que aparece en la fotografia." }
              - { label: "Fecha de la fotografia", name: "date", widget: "datetime", required: false, date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }

  - name: "videos_admin"
    label: "Videos"
    description: "Administra los videos mostrados en la pagina principal."
    files:
      - name: "videos"
        label: "Videos de YouTube"
        file: "data/videos.json"
        format: "json"
        fields:
          - label: "Lista de videos"
            name: "videos"
            widget: "list"
            label_singular: "Agregar video"
            summary: "{{fields.title}}"
            collapsed: true
            add_to_top: true
            fields:
              - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
              - { label: "ID de YouTube", name: "id", widget: "string", hint: "Ejemplo: en youtube.com/watch?v=OgonAQOnNSo, el ID es OgonAQOnNSo." }
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "Descripcion corta", name: "description", widget: "text", required: false }

  - name: "filiales_admin"
    label: "Filiales"
    description: "Direcciones, contactos, horarios y ubicaciones de las iglesias."
    files:
      - name: "filiales"
        label: "Administrar filiales"
        file: "data/filiales.json"
        format: "json"
        fields:
          - label: "Lista de filiales"
            name: "filiales"
            widget: "list"
            label_singular: "Agregar filial"
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Direccion", name: "address", widget: "string", required: false }
              - label: "Zona o departamento"
                name: "zone"
                widget: "select"
                required: false
                options:
                  - { label: "San Miguel", value: "san miguel" }
                  - { label: "Morazan", value: "morazan" }
                  - { label: "Cabanas", value: "cabanas" }
                  - { label: "Cuscatlan", value: "cuscatlan" }
                  - { label: "La Libertad", value: "la libertad" }
                  - { label: "Otro", value: "otro" }
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Enlace de Google Maps", name: "mapsUrl", widget: "string", required: false }
              - { label: "Mapa incrustado", name: "embedUrl", widget: "string", required: false, hint: "Opcional. Pega solamente el src del iframe de Google Maps." }
              - { label: "Encargado o contacto", name: "contact", widget: "string", required: false }
              - { label: "Horario", name: "schedule", widget: "string", required: false }

  - name: "pagina_admin"
    label: "Pagina principal"
    description: "Versiculo semanal y datos usados al compartir el sitio."
    files:
      - name: "versiculo"
        label: "Versiculo de la semana"
        file: "data/versiculo.json"
        format: "json"
        fields:
          - { label: "Mostrar en la pagina", name: "published", widget: "boolean", default: true }
          - { label: "Cita biblica", name: "reference", widget: "string" }
          - { label: "Texto del versiculo", name: "text", widget: "text" }
          - { label: "Nota corta", name: "note", widget: "string", required: false }
      - name: "ajustes"
        label: "SEO y compartir"
        file: "data/ajustes.json"
        format: "json"
        fields:
          - label: "Datos del sitio"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "Descripcion", name: "description", widget: "text" }
              - { label: "Imagen para compartir", name: "image", widget: "image", required: false }
